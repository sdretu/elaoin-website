---
layout: fullwidth
---

    {{ content }}

    <section class="start-page">
      <div class="switch links">
      {%- assign tile_width = 100.0 | divided_by: site.categories.size %}
      {%- for category in site.categories %}
        {%- assign name = category[0] %}
        <a class="switch-link {{ name }}" href="/{{ name }}" style="width: {{ tile_width }}%">
          <div class="bg" style="background-image: url('{{ name | prepend: '/assets/' | append: '.png' | relative_url }}')"></div>
          <span class="title">{{ name }}</span>
        </a>
      {%- endfor %}
      </div>
    </section>
