---
layout: fullwidth
---

  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}

    {{ content }}

    <section class="start-page tiles--zoom">
      <div class="switch links">
      {%- for post in site.categories[page.category] %}
        <a class="switch-link {{ post.slug }}" href="{{ post.url | relative_url }}">
          <div class="bg" style="background-image: url('{{ post.bg | relative_url }}')"></div>
          <span class="title">{{ post.title }}</span>
        </a>
      {%- endfor %}
      </div>
    </section>
